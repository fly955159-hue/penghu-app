<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#163bc0">
  <title>澎湖輪</title>
  <link rel="icon" href="https://tnc-kao.com.tw/images/icons/logo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-touch-icon" href="https://tnc-kao.com.tw/images/icons/logo.png">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="澎湖輪">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <div id="app">

    <!-- 頂部 -->
    <header class="app-header">
      <img src="https://tnc-kao.com.tw/images/icons/logo.png" alt="澎湖輪" class="logo">
      <div class="header-right">
        <button class="header-icon-btn">🔔</button>
        <button class="header-icon-btn">👤</button>
      </div>
    </header>

    <!-- 第二行：功能列 -->
    <div class="nav-tabs">
      <button class="nav-tab active">一般訂票</button>
    </div>

    <!-- 首頁 -->
    <section id="page-home" class="page active">
      <div class="page-scroll">

        <!-- 訂票卡片 -->
        <div class="booking-card">

          <!-- 營運狀態 -->
          <div class="status-bar">
            <span class="status-dot"></span>
            <span class="status-text">正常營運中</span>
          </div>

          <div class="card-divider"></div>

          <!-- 路線 -->
          <div class="route-row" id="field-departure">
            <div class="route-station">
              <div class="route-station-label">出發港</div>
              <div class="route-station-name" id="home-departure">高雄</div>
            </div>
            <button class="route-swap-btn">⇄</button>
            <div class="route-station" style="text-align:right">
              <div class="route-station-label">目的港</div>
              <div class="route-station-name" id="home-destination">澎湖</div>
            </div>
          </div>

          <!-- 單程/來回 -->
          <div class="trip-tabs">
            <button class="trip-tab active" data-trip="single">單程票</button>
            <button class="trip-tab" data-trip="round">來回票</button>
          </div>

          <div class="card-divider"></div>

          <!-- 欄位列表 -->
          <div class="field-list">
            <button class="field-row" id="field-date-go">
              <span class="field-row-icon">📅</span>
              <div class="field-row-text">
                <span class="field-row-label">去程日期</span>
                <span class="field-row-value" id="home-date-go">請選擇日期</span>
              </div>
              <span class="field-row-arrow">›</span>
            </button>

            <div class="field-row-divider"></div>

            <button class="field-row field-round-only hidden" id="field-date-back">
              <span class="field-row-icon">📅</span>
              <div class="field-row-text">
                <span class="field-row-label">回程日期</span>
                <span class="field-row-value" id="home-date-back">請選擇日期</span>
              </div>
              <span class="field-row-arrow">›</span>
            </button>

            <button class="field-row" id="field-cabin">
              <span class="field-row-icon">🚢</span>
              <div class="field-row-text">
                <span class="field-row-label">艙等種類</span>
                <span class="field-row-value">經濟艙</span>
              </div>
              <span class="field-row-arrow">›</span>
            </button>

            <div class="field-row-divider"></div>

            <button class="field-row" id="field-passengers">
              <span class="field-row-icon">👤</span>
              <div class="field-row-text">
                <span class="field-row-label">乘客人數</span>
                <span class="field-row-value">大人 1 位</span>
              </div>
              <span class="field-row-arrow">›</span>
            </button>

            <div class="field-row-divider"></div>

            <button class="field-row" data-nav="vehicle">
              <span class="field-row-icon">🚗</span>
              <div class="field-row-text">
                <span class="field-row-label">加購車輛</span>
                <span class="field-row-value">不加購</span>
              </div>
              <span class="field-row-arrow">›</span>
            </button>
          </div>

          <div class="card-divider"></div>

          <!-- 搜尋按鈕 -->
          <button class="btn btn-primary btn-large" id="btn-search">
            搜尋航班
          </button>

        </div>

      </div>
    </section>

    <!-- 選擇艙等 -->
    <section id="page-cabin" class="page">
      <header class="page-header">
        <button class="btn-back" data-nav="home">‹</button>
        <h2>選擇艙等</h2>
        <div class="header-spacer"></div>
      </header>
      <div class="page-content">
        <p class="section-label">請選擇艙等種類</p>
        <div class="option-cards">
          <button class="option-card" data-cabin="economy">
            <div class="option-card-left">
              <span class="option-icon">💺</span>
              <div class="option-info">
                <span class="option-name">經濟座艙</span>
                <span class="option-hint">一般座位，開放購買</span>
              </div>
            </div>
            <span class="option-check" id="check-economy"></span>
          </button>
          <button class="option-card" data-cabin="business">
            <div class="option-card-left">
              <span class="option-icon">🪑</span>
              <div class="option-info">
                <span class="option-name">商務座艙</span>
                <span class="option-hint">較寬敞座位</span>
              </div>
            </div>
            <span class="option-check" id="check-business"></span>
          </button>
          <button class="option-card" data-cabin="berth">
            <div class="option-card-left">
              <span class="option-icon">🛏️</span>
              <div class="option-info">
                <span class="option-name">臥鋪艙</span>
                <span class="option-hint">躺臥休息，可單獨購買</span>
              </div>
            </div>
            <span class="option-check" id="check-berth"></span>
          </button>
          <button class="option-card" data-cabin="first">
            <div class="option-card-left">
              <span class="option-icon">⭐</span>
              <div class="option-info">
                <span class="option-name">頭等艙</span>
                <span class="option-hint">需同時購買4人以上</span>
              </div>
            </div>
            <span class="option-check" id="check-first"></span>
          </button>
          <button class="option-card" data-cabin="suite">
            <div class="option-card-left">
              <span class="option-icon">👑</span>
              <div class="option-info">
                <span class="option-name">特等艙</span>
                <span class="option-hint">需同時購買2人以上</span>
              </div>
            </div>
            <span class="option-check" id="check-suite"></span>
          </button>
          <button class="option-card" data-cabin="vip">
            <div class="option-card-left">
              <span class="option-icon">💎</span>
              <div class="option-info">
                <span class="option-name">VIP艙</span>
                <span class="option-hint">NT$6,000／間，每間限2人</span>
              </div>
            </div>
            <span class="option-check" id="check-vip"></span>
          </button>
        </div>
      </div>
    </section>

    <!-- 乘客人數 -->
    <section id="page-passengers" class="page">
      <header class="page-header">
        <button class="btn-back" data-nav="home">‹</button>
        <h2>乘客人數</h2>
        <div class="header-spacer"></div>
      </header>
      <div class="page-content">
        <p class="section-label">請選擇乘客人數</p>
        <div class="passenger-list">
          <div class="passenger-row">
            <div class="passenger-info">
              <span class="passenger-name">全票</span>
              <span class="passenger-hint">12歲以上</span>
            </div>
            <div class="counter">
              <button class="counter-btn" data-type="adult" data-action="minus">－</button>
              <span class="counter-val" id="count-adult">1</span>
              <button class="counter-btn" data-type="adult" data-action="plus">＋</button>
            </div>
          </div>
          <div class="passenger-row">
            <div class="passenger-info">
              <span class="passenger-name">兒童票</span>
              <span class="passenger-hint">3歲～未滿12歲</span>
            </div>
            <div class="counter">
              <button class="counter-btn" data-type="child" data-action="minus">－</button>
              <span class="counter-val" id="count-child">0</span>
              <button class="counter-btn" data-type="child" data-action="plus">＋</button>
            </div>
          </div>
          <div class="passenger-row">
            <div class="passenger-info">
              <span class="passenger-name">敬老票</span>
              <span class="passenger-hint">65歲以上本國籍</span>
            </div>
            <div class="counter">
              <button class="counter-btn" data-type="senior" data-action="minus">－</button>
              <span class="counter-val" id="count-senior">0</span>
              <button class="counter-btn" data-type="senior" data-action="plus">＋</button>
            </div>
          </div>
          <div class="passenger-row">
            <div class="passenger-info">
              <span class="passenger-name">愛心票</span>
              <span class="passenger-hint">持有效身障手冊</span>
            </div>
            <div class="counter">
              <button class="counter-btn" data-type="disabled" data-action="minus">－</button>
              <span class="counter-val" id="count-disabled">0</span>
              <button class="counter-btn" data-type="disabled" data-action="plus">＋</button>
            </div>
          </div>
          <div class="passenger-row">
            <div class="passenger-info">
              <span class="passenger-name">陪同票</span>
              <span class="passenger-hint">身障旅客之陪同者</span>
            </div>
            <div class="counter">
              <button class="counter-btn" data-type="companion" data-action="minus">－</button>
              <span class="counter-val" id="count-companion">0</span>
              <button class="counter-btn" data-type="companion" data-action="plus">＋</button>
            </div>
          </div>
          <div class="passenger-row">
            <div class="passenger-info">
              <span class="passenger-name">澎湖縣民票</span>
              <span class="passenger-hint">澎湖縣戶籍，需持證件</span>
            </div>
            <div class="counter">
              <button class="counter-btn" data-type="penghu" data-action="minus">－</button>
              <span class="counter-val" id="count-penghu">0</span>
              <button class="counter-btn" data-type="penghu" data-action="plus">＋</button>
            </div>
          </div>
          <div class="passenger-row">
            <div class="passenger-info">
              <span class="passenger-name">嬰保票</span>
              <span class="passenger-hint">未滿3歲，NT$100</span>
            </div>
            <div class="counter">
              <button class="counter-btn" data-type="infant" data-action="minus">－</button>
              <span class="counter-val" id="count-infant">0</span>
              <button class="counter-btn" data-type="infant" data-action="plus">＋</button>
            </div>
          </div>
        </div>
        <button class="btn btn-primary btn-large" id="btn-passengers-confirm" style="border-radius:12px;margin-top:24px;">
          確認人數
        </button>
      </div>
    </section>

    <!-- 選擇出發地 -->
    <section id="page-route" class="page">
      <header class="page-header">
        <button class="btn-back" data-nav="home">‹</button>
        <h2>選擇出發地</h2>
        <div class="header-spacer"></div>
      </header>
      <div class="page-content">
        <p class="section-label">請選擇您的出發港口</p>
        <div class="route-cards">
          <button class="route-card" data-departure="kaohsiung">
            <div class="route-card-icon">🚢</div>
            <div class="route-info">
              <span class="route-city">高雄</span>
              <span class="route-hint">高雄港出發，前往澎湖</span>
            </div>
            <span class="route-card-arrow">›</span>
          </button>
          <button class="route-card" data-departure="penghu">
            <div class="route-card-icon">🏝️</div>
            <div class="route-info">
              <span class="route-city">澎湖</span>
              <span class="route-hint">馬公港出發，前往高雄</span>
            </div>
            <span class="route-card-arrow">›</span>
          </button>
        </div>
      </div>
    </section>

    <!-- 選擇日期 -->
    <section id="page-date" class="page">
      <header class="page-header">
        <button class="btn-back" data-nav="home">‹</button>
        <h2 id="date-page-title">選擇去程日期</h2>
        <div class="header-spacer"></div>
      </header>
      <div class="page-content" style="padding:12px 16px">
        <div class="selected-route-banner" id="date-route-banner"></div>
        <div class="cal-card">
          <div class="cal-header">
            <button class="cal-nav" id="cal-prev">‹</button>
            <span class="cal-title" id="cal-title"></span>
            <button class="cal-nav" id="cal-next">›</button>
          </div>
          <div class="cal-weekdays">
            <span class="sun">日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span class="sat">六</span>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
        </div>
        <div id="time-slots-wrap" class="hidden">
          <div class="time-slots-label">選擇出發時間</div>
          <div class="time-slots" id="time-slots"></div>
        </div>
        <div class="cal-hint">
          <span>📌 開放訂票：出發前 56 天起，開航前 4 小時止</span>
        </div>
        <button class="btn btn-primary btn-large" id="btn-date-confirm" disabled style="border-radius:12px;margin-top:12px;">
          確認日期
        </button>
      </div>
    </section>

    <!-- 航班結果 -->
    <section id="page-results" class="page">
      <header class="page-header">
        <button class="btn-back" data-nav="home">‹</button>
        <h2>航班查詢結果</h2>
        <div class="header-spacer"></div>
      </header>
      <div class="page-content">
        <div class="search-summary" id="search-summary"></div>
        <div class="flight-list" id="flight-list"></div>
        <p class="confirm-note">完整訂票請前往 <a href="https://tnc-kao.com.tw/booking" target="_blank" rel="noopener">官網線上訂票</a></p>
      </div>
    </section>

  </div>

  <!-- 底部 Tab Bar -->
  <nav class="tab-bar">
    <button class="tab-item" onclick="window.open('https://tnc-kao.com.tw/order/code','_blank')">
      <span class="tab-icon">🎫</span>
      <span>我的車票</span>
    </button>
    <button class="tab-item active" data-nav="home">
      <span class="tab-icon">🔍</span>
      <span>訂票</span>
    </button>
    <button class="tab-item" onclick="window.open('https://tnc-kao.com.tw/order/code','_blank')">
      <span class="tab-icon">💳</span>
      <span>付款/取票</span>
    </button>
    <button class="tab-item" onclick="window.open('https://tnc-kao.com.tw/order/code','_blank')">
      <span class="tab-icon">📥</span>
      <span>載入訂位</span>
    </button>
    <button class="tab-item" onclick="window.open('https://tnc-kao.com.tw','_blank')">
      <span class="tab-icon">•••</span>
      <span>其他</span>
    </button>
  </nav>

  <script src="app.js?v=3"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
