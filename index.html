<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#163bc0">
  <title>澎湖輪</title>
  <link rel="icon" href="https://tnc-kao.com.tw/images/icons/logo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-touch-icon" href="https://tnc-kao.com.tw/images/icons/logo.png">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="澎湖輪">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">

    <!-- 頂部導覽列 -->
    <header class="app-header">
      <div class="header-logo">
        <img src="https://tnc-kao.com.tw/images/icons/logo.png" alt="澎湖輪" class="logo">
        <span class="header-title">澎湖輪</span>
      </div>
      <div class="header-right">
        <button class="header-icon-btn" onclick="window.open('https://tnc-kao.com.tw/order/code','_blank')">
          <span>👤</span>
        </button>
      </div>
    </header>

    <!-- 首頁 -->
    <section id="page-home" class="page active">
      <div class="page-scroll">

        <!-- 訂票卡片 -->
        <div class="booking-card">

          <!-- 單程/來回切換 -->
          <div class="trip-tabs">
            <button class="trip-tab active" data-trip="single">單程票</button>
            <button class="trip-tab" data-trip="round">來回票</button>
          </div>

          <!-- 路線 -->
          <div class="route-row" id="field-departure" data-nav="route">
            <div class="route-station">
              <div class="route-station-label">出發地</div>
              <div class="route-station-name" id="home-departure">高雄</div>
            </div>
            <div class="route-swap-btn">⇄</div>
            <div class="route-station">
              <div class="route-station-label">目的地</div>
              <div class="route-station-name" id="home-destination">澎湖</div>
            </div>
          </div>

          <!-- 日期 -->
          <button class="field-btn" data-nav="date" id="field-date-go">
            <span class="field-icon-text">📅</span>
            <div class="field-text">
              <span class="field-label">去程日期</span>
              <span class="field-value" id="home-date-go">請選擇日期</span>
            </div>
            <span class="field-arrow">›</span>
          </button>

          <button class="field-btn field-round-only hidden" data-nav="date-back" id="field-date-back">
            <span class="field-icon-text">📅</span>
            <div class="field-text">
              <span class="field-label">回程日期</span>
              <span class="field-value" id="home-date-back">請選擇日期</span>
            </div>
            <span class="field-arrow">›</span>
          </button>

          <!-- 加購車輛 -->
          <label class="vehicle-check">
            <input type="checkbox" id="add-vehicle">
            <span>加購車輛託運</span>
          </label>

          <!-- 搜尋按鈕 -->
          <button class="btn btn-primary btn-large" id="btn-search">
            搜尋航班
          </button>
        </div>

      </div>
    </section>

    <!-- 選擇出發地 -->
    <section id="page-route" class="page">
      <header class="page-header">
        <button class="btn-back" data-nav="home">‹</button>
        <h2>選擇出發地</h2>
        <div class="header-spacer"></div>
      </header>
      <div class="page-content">
        <p class="section-label">請選擇您的出發港口</p>
        <div class="route-cards">
          <button class="route-card" data-departure="kaohsiung">
            <div class="route-card-icon">🚢</div>
            <div class="route-info">
              <span class="route-city">高雄</span>
              <span class="route-hint">高雄港出發，前往澎湖</span>
            </div>
            <span class="route-card-arrow">›</span>
          </button>
          <button class="route-card" data-departure="penghu">
            <div class="route-card-icon">🏝️</div>
            <div class="route-info">
              <span class="route-city">澎湖</span>
              <span class="route-hint">馬公港出發，前往高雄</span>
            </div>
            <span class="route-card-arrow">›</span>
          </button>
        </div>
      </div>
    </section>

    <!-- 選擇日期 -->
    <section id="page-date" class="page">
      <header class="page-header">
        <button class="btn-back" data-nav="home">‹</button>
        <h2 id="date-page-title">選擇去程日期</h2>
        <div class="header-spacer"></div>
      </header>
      <div class="page-content">
        <div class="selected-route-banner" id="date-route-banner"></div>
        <div class="date-picker-wrap">
          <input type="date" id="departure-date" class="date-input" aria-label="出發日期">
        </div>
        <div class="calendar-hint">
          <p>📌 訂票開放：開航前 56 天起至開航前 4 小時止</p>
          <p>📌 開航前 30 分鐘停止售票</p>
          <p>📌 船期受天候影響，請以官網公告為準</p>
        </div>
        <button class="btn btn-primary btn-large" id="btn-date-confirm" disabled>
          確認日期
        </button>
      </div>
    </section>

    <!-- 航班結果 -->
    <section id="page-results" class="page">
      <header class="page-header">
        <button class="btn-back" data-nav="home">‹</button>
        <h2>航班查詢結果</h2>
        <div class="header-spacer"></div>
      </header>
      <div class="page-content">
        <div class="search-summary" id="search-summary"></div>
        <div class="flight-list" id="flight-list"></div>
        <p class="confirm-note">完整訂票請前往 <a href="https://tnc-kao.com.tw/booking" target="_blank" rel="noopener">官網線上訂票</a></p>
      </div>
    </section>

  </div>

  <!-- 底部 Tab Bar -->
  <nav class="tab-bar">
    <button class="tab-item active" data-nav="home">
      <span class="tab-icon">🎫</span>
      <span>訂票</span>
    </button>
    <button class="tab-item" onclick="window.open('https://tnc-kao.com.tw/order/code','_blank')">
      <span class="tab-icon">🎟️</span>
      <span>我的車票</span>
    </button>
    <button class="tab-item" onclick="window.open('https://tnc-kao.com.tw/order/code','_blank')">
      <span class="tab-icon">📱</span>
      <span>電票</span>
    </button>
    <button class="tab-item" onclick="window.open('https://tnc-kao.com.tw/order/code','_blank')">
      <span class="tab-icon">💳</span>
      <span>付款取票</span>
    </button>
    <button class="tab-item" onclick="window.open('https://tnc-kao.com.tw/order/code','_blank')">
      <span class="tab-icon">☰</span>
      <span>其他</span>
    </button>
  </nav>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
